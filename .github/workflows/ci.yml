name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (make ci)
    runs-on: ubuntu-latest   # Docker is preinstalled: Testcontainers works
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: backend
          install-only: true
      # lint + unit + integration (-race, one merged coverage profile) + 80 % gate
      - run: make ci
      - name: Coverage summary
        if: always()
        run: |
          [ -f cover.out ] && echo "### Backend coverage: $(go tool cover -func=cover.out | awk '/^total:/ {print $3}')" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/cover.out
          if-no-files-found: ignore

  frontend:
    name: frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend-image:
    name: frontend image (nginx checks, helm lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-frontend-image.sh
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: helm lint deploy/frontend --set image.tag=ci
      - run: helm template deploy/frontend --set image.tag=ci >/dev/null
