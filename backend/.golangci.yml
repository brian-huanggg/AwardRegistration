version: "2"
run:
  build-tags: [integration]
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - errorlint
    - depguard
  settings:
    depguard:
      rules:
        no-orm:
          list-mode: lax
          files: ["$all"]
          deny:
            - pkg: gorm.io
              desc: ORMs are banned (Backend.md §2.3); use native database/sql
            - pkg: entgo.io
              desc: ORMs are banned (Backend.md §2.3); use native database/sql
            - pkg: github.com/uptrace/bun
              desc: ORMs are banned (Backend.md §2.3); use native database/sql
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
formatters:
  enable: [gofmt]
