openapi: 3.0.3
info:
  title: ESG Idea Contest API
  version: 1.0.0
  description: >
    Single source of the API contract (Backend.md G4). Skeleton: shared components plus the
    operations needed to lock binding rules; the remaining endpoints of docs/API/api-endpoints.md
    are added by their own PRs. Error codes: docs/API/error-codes.md, testdata/error-codes.json.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: auth
  - name: deadline
  - name: ideas
paths:
  /auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [auth]
      summary: Session-bound CSRF token (anonymous before login)
      security: []
      responses:
        '200':
          description: Token to send as X-CSRF-Token on every write
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfTokenResponse' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with employee ID and password (issues a new session)
      description: >
        Sets the session cookie and returns the caller. Unknown, malformed and disabled
        accounts and wrong passwords all answer the same 401. The CSRF token changes
        with the session, so the client refetches it.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in
          headers:
            Set-Cookie:
              description: __Host-session=<opaque ID>; HttpOnly; Secure; SameSite=Lax; Path=/
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '429':
          description: Throttled (LOGIN_THROTTLED)
          headers:
            Retry-After:
              description: Seconds until a new attempt may succeed
              schema: { type: integer, minimum: 1 }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the session
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Logged out }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The caller (also the idle-timeout "continue" call)
      responses:
        '200':
          description: The authenticated caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Self-service registration (no session is created)
      description: >
        Validation order: format, password policy, uniqueness (PRD 6.3). Sets no cookie.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created; log in separately
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /deadline:
    get:
      operationId: getDeadline
      tags: [deadline]
      summary: Submission deadline, state and database server time
      security: []
      responses:
        '200':
          description: Current deadline state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deadline' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /ideas:
    get:
      operationId: listIdeas
      tags: [ideas]
      summary: List Ideas visible to the caller
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: org
          in: query
          description: Closed set; an invalid value is 422 INVALID_ENUM (never ignored). Validated in the handler.
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: direction
          in: query
          schema: { type: string }
        - name: leaderEmpNo
          in: query
          schema: { type: string }
        - name: createdFrom
          in: query
          description: ISO 8601 instant with offset or Z; inclusive. Validated in the handler.
          schema: { type: string }
        - name: createdTo
          in: query
          description: ISO 8601 instant with offset or Z; exclusive. Validated in the handler.
          schema: { type: string }
        - name: q
          in: query
          description: Case-insensitive "name contains"; `%` and `_` are literal.
          schema: { type: string }
        - name: sort
          in: query
          description: createdAt (default) or name; anything else is 422 INVALID_ENUM. Validated in the handler.
          schema: { type: string }
        - name: order
          in: query
          description: asc or desc (default desc for createdAt, asc for name); anything else is 422 INVALID_ENUM. Validated in the handler.
          schema: { type: string }
      responses:
        '200':
          description: One page of IdeaSummary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdeaPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createIdea
      tags: [ideas]
      summary: Create an Idea with its slides (User only)
      description: >
        One atomic multipart request (PRD 6.6). Order: role 403, state 403, 400 (missing or repeated
        part), 422 text fields (incl. FILENAME_TOO_LONG), file 413 / 422 EMPTY_FILE / 415 /
        422 FILENAME_MISMATCH, 409 IDEA_DUPLICATE, then upload (503 STORAGE_UNAVAILABLE). The Leader is
        the caller; any leader value in the form is ignored. The body is read by the handler, so the
        generated wrapper does not bind it.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/CreateIdeaForm' }
      responses:
        '201':
          description: Created; Location is /api/v1/ideas/{id}
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdeaDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /ideas/{id}:
    get:
      operationId: getIdea
      tags: [ideas]
      summary: Idea detail
      parameters:
        - $ref: '#/components/parameters/IdeaId'
      responses:
        '200':
          description: IdeaDetail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdeaDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: >
        Session-bound token from GET /auth/csrf. Mandatory on every write, but enforced by the CSRF
        middleware (403 CSRF_INVALID), so the generated wrapper must not reject its absence first (400).
      schema: { type: string }
    IdeaId:
      name: id
      in: path
      required: true
      description: A malformed ID answers the uniform 404, not 400.
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457 problem; `code` is the stable contract (docs/API/error-codes.md)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    CsrfTokenResponse:
      type: object
      required: [token]
      properties:
        token: { type: string }
    LoginRequest:
      type: object
      required: [empNo, password]
      properties:
        empNo: { type: string, description: 'Any string; a badly formatted ID is an ordinary login failure' }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      required: [empNo, name, email, role]
      properties:
        empNo: { type: string }
        name: { type: string }
        email: { type: string, nullable: true, description: null for Admin }
        role: { type: string, enum: [USER, ADMIN] }
    RegisterRequest:
      type: object
      required: [empNo, name, email, password]
      properties:
        empNo: { type: string, description: 'Exactly 6 ASCII digits' }
        name: { type: string, description: 1-50 code points after clean-up }
        email: { type: string, description: 'Printable ASCII with exactly one @, at most 254 characters; stored lower-cased' }
        password: { type: string, format: password }
    RegisterResponse:
      type: object
      required: [empNo, name, email]
      properties:
        empNo: { type: string }
        name: { type: string }
        email: { type: string }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string }
        status: { type: integer }
        code: { type: string, description: One of testdata/error-codes.json }
        detail: { type: string }
        requestId: { type: string, format: uuid }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string }
        expected: { type: string }
        rule: { type: string, description: 'PASSWORD_POLICY only, the violated rule id (PRD 6.4)' }
    Deadline:
      type: object
      required: [deadline, state, serverTime]
      properties:
        deadline: { type: string, format: date-time, nullable: true }
        state: { type: string, enum: [NOT_OPEN, OPEN, CLOSED] }
        serverTime: { type: string, format: date-time, description: Millisecond precision }
    PersonRef:
      type: object
      required: [empNo, name]
      properties:
        empNo: { type: string }
        name: { type: string }
    CreateIdeaForm:
      type: object
      required: [category, org, direction, name, summary, slides]
      properties:
        category: { type: string, description: 'COOL_IDEA or OUTSTANDING_IMPACT' }
        org: { type: string, description: 'AAID, BSID, ICSD, TSID, PLED or DEID' }
        direction: { type: string, description: One of the five ESG directions (PRD 6.6) }
        name: { type: string, description: '1-75 code points after clean-up; no / \ : * ? " < > |' }
        summary: { type: string, description: 1-300 code points after clean-up }
        slides:
          type: string
          format: binary
          description: 'One PDF or PPTX, at most 5 MiB, named {I|O}_{org}_{leaderName}_{leaderEmpNo}_{name}.{pdf|pptx}'
    IdeaSummary:
      type: object
      required: [id, name, category, org, direction, leader, memberCount, myRelation, createdAt, slidesUpdatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string }
        org: { type: string }
        direction: { type: string }
        leader: { $ref: '#/components/schemas/PersonRef' }
        memberCount: { type: integer }
        myRelation: { type: string, enum: [LEADER, MEMBER], nullable: true, description: null for Admin }
        createdAt: { type: string, format: date-time }
        slidesUpdatedAt: { type: string, format: date-time }
    IdeaPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/IdeaSummary' }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
    IdeaDetail:
      type: object
      required: [id, category, org, direction, name, summary, leader, members, pendingRequests, slides, expectedFilenameBase, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        category: { type: string }
        org: { type: string }
        direction: { type: string }
        name: { type: string }
        summary: { type: string }
        leader: { $ref: '#/components/schemas/PersonRef' }
        members:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/PersonRef'
              - type: object
                required: [joinedAt]
                properties:
                  joinedAt: { type: string, format: date-time }
        pendingRequests:
          type: array
          nullable: true
          description: null unless Leader or Admin
          items:
            allOf:
              - $ref: '#/components/schemas/PersonRef'
              - type: object
                required: [requestedAt]
                properties:
                  requestedAt: { type: string, format: date-time }
        slides:
          type: object
          required: [ext, size, sha256, updatedAt, downloadFilename]
          properties:
            ext: { type: string }
            size: { type: integer, format: int64 }
            sha256: { type: string }
            updatedAt: { type: string, format: date-time }
            downloadFilename: { type: string }
        expectedFilenameBase: { type: string, description: Without extension }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
