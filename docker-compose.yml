# Local development stack: MariaDB 11.4 LTS, MinIO, Flyway (O0-02).
# Credentials below are throwaway local defaults; override via environment or .env.
name: esg-idea-contest

services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-esg}
      MARIADB_USER: ${DB_USER:-esg}
      MARIADB_PASSWORD: ${DB_PASSWORD:-esg}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # Chainguard image is distroless (no shell/curl), so no container healthcheck.
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  flyway:
    image: flyway/flyway:11
    profiles: ["migrate"]   # only runs via `make migrate` (docker compose run)
    depends_on:
      mariadb:
        condition: service_healthy
    command: ["migrate"]
    environment:
      FLYWAY_URL: jdbc:mariadb://mariadb:3306/${DB_NAME:-esg}
      FLYWAY_USER: ${DB_USER:-esg}
      FLYWAY_PASSWORD: ${DB_PASSWORD:-esg}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./backend/db/migration:/flyway/sql:ro

volumes:
  mariadb-data:
  minio-data:
