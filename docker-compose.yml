# Local development stack: MariaDB 11.4 LTS, MinIO (O0-02); migrations run with `make migrate`.
# Credentials below are throwaway local defaults; override via environment or .env.
name: esg-idea-contest

services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-esg}
      MARIADB_USER: ${DB_USER:-esg}
      MARIADB_PASSWORD: ${DB_PASSWORD:-esg}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # Chainguard image is distroless (no shell/curl), so no container healthcheck.
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

volumes:
  mariadb-data:
  minio-data:
